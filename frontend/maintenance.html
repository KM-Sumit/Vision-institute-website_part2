<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Offline | The Vision Institute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { DEFAULT: '#1a365d' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Source Sans 3', sans-serif; background-color: #1a365d; color: white; margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        h1 { font-family: 'Playfair Display', serif; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); opacity: 0.5; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-navy relative overflow-hidden">
    <!-- Background Accents -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-blue-500/10 blur-[100px]"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-yellow-500/10 blur-[100px]"></div>
    </div>

    <div class="z-10 w-full max-w-2xl px-6 py-12">
        <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-8 md:p-14 rounded-[2rem] shadow-2xl text-center">
            
            <div class="w-24 h-24 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-8 pulse border border-red-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-10 h-10">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            
            <h1 class="text-4xl md:text-5xl font-bold mb-4 tracking-tight text-white">Server Offline</h1>
            <div class="w-20 h-1 bg-yellow-500 mx-auto mb-6 rounded-full"></div>
            
            <p class="text-gray-300 text-lg md:text-xl mb-8 leading-relaxed font-light">
                The Vision Institute portal is currently down for scheduled maintenance and security upgrades.
            </p>
            
            <div class="bg-black/40 rounded-2xl p-6 border border-white/5 inline-block min-w-[250px]">
                <p class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-3">System Status</p>
                <div class="flex items-center justify-center gap-3 text-red-400 font-bold text-xl tracking-wide">
                    <span class="relative flex h-4 w-4">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-4 w-4 bg-red-500"></span>
                    </span>
                    OFFLINE
                </div>
            </div>
            
            <p class="text-gray-500 text-sm mt-10 font-medium">Please check back later.</p>
        </div>
    </div>
</body>
</html>
